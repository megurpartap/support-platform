services:
  postgres:
    image: postgres:17
    container_name: support-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support_dev_password
      POSTGRES_DB: support_platform
    ports:
      - "5432:5432"
    volumes:
      - support_platform_postgres_data:/var/lib/postgresql/data

volumes:
  support_platform_postgres_data: